name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

            - name: Install Node dependencies
        working-directory: artifacts/line-translator
        run: pnpm install

      - name: Generate Capacitor Android files
        working-directory: artifacts/line-translator
        run: npx cap sync android

      - name: Build debug APK
        working-directory: artifacts/line-translator/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: line-translator-debug-apk
          path: artifacts/line-translator/android/app/build/outputs/apk/debug/app-debug.apk
