name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK di test
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4

      - name: Accetta le licenze Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installa Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Compila il progetto web e sincronizza Capacitor
        run: pnpm --filter @workspace/line-translator run android:sync

      - name: Controlla il progetto Android
        working-directory: artifacts/line-translator/android
        run: |
          test -f gradlew
          test -d app

      - name: Crea APK debug di test
        working-directory: artifacts/line-translator/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Controlla che l'APK sia stato creato
        run: |
          test -f artifacts/line-translator/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh artifacts/line-translator/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: line-translator-apk-test
          path: artifacts/line-translator/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
